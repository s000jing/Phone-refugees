<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAIST Phone Refugees</title>
    <style>
        /* 배경 검은색 유지 및 폰트를 Helvetica로 전면 교체 */
        body { 
            background-color: #000000; 
            color: #fff; 
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 빨간색 공중전화부스 내부 투시 프레임 */
        .booth { 
            width: 100%;
            max-width: 420px; 
            height: 680px;
            background: linear-gradient(180deg, #3a0d0d, #1a0505);
            border: 16px solid #dc2626; 
            border-radius: 30px; 
            box-shadow: 
                0 0 50px rgba(220, 38, 38, 0.3),
                inset 0 0 30px rgba(0, 0, 0, 0.9); 
            padding: 40px 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        /* 부스 상단 내부 유리창 틀 장식 */
        .booth-window {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 80px;
            pointer-events: none; 
        }

        /* TELEPHONE 내부 간판 */
        .booth-sign {
            background-color: #110303;
            width: 100%;
            text-align: center;
            padding: 14px 0;
            border-radius: 10px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.8), 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            gap: 6px;
            z-index: 5;
        }

        .letter {
            font-weight: 900;
            font-size: 26px;
            letter-spacing: 1px;
            color: #3a1515; 
            transition: all 0.3s ease;
        }

        /* 7개마다 불 켜지는 네온 효과 */
        .letter.active {
            color: #ffcc00; 
            text-shadow: 0 0 12px #ffbb00, 0 0 25px #ff7700;
        }

        /* 아날로그 전화기 본체 */
        .phone-machine {
            width: 90%;
            background: linear-gradient(135deg, #262626, #171717);
            border-radius: 25px;
            padding: 30px 20px;
            box-sizing: border-box;
            box-shadow: 
                0 15px 35px rgba(0,0,0,0.7), 
                inset 0 2px 4px rgba(255,255,255,0.1);
            border: 3px solid #404040;
            text-align: center;
            z-index: 5;
            margin-bottom: 20px;
        }
