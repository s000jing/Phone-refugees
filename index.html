<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAIST Phone Refugees</title>
    <style>
        body { 
            background-color: #0d0804; 
            color: #fff; 
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; 
            display: flex;
            justify-content: center;
            align-items: flex-end; 
            height: 100vh;
            margin: 0;
            overflow: hidden; 
        }

        /* 거대 도서관 책 선반 프레임 */
        .giant-shelf {
            width: 100vw;
            height: 740px; 
            display: flex;
            align-items: flex-end;
            justify-content: center; 
            border-bottom: 24px solid #5c3a21; 
            box-shadow: 
                inset 0 80px 150px rgba(0,0,0,0.95),
                inset 0 -20px 40px rgba(0,0,0,0.6);
            position: relative;
            box-sizing: border-box;
            background: linear-gradient(180deg, #1f140a, #0d0804); 
        }

        /* 1번 수정: 좌우 균형을 1:1로 강제 매칭하여 부스를 정중앙에 고정 */
        .book-group {
            flex-grow: 1;
            flex-basis: 0;
            display: flex;
            align-items: flex-end;
            gap: 2px;
            overflow: hidden;
            box-sizing: border-box;
            opacity: 0.4;
        }
        
        .book-group.left { justify-content: flex-end; padding-right: 15px; }
        .book-group.right { justify-content: flex-start; padding-left: 15px; }

        .giant-book {
            flex-shrink: 0;
            border-radius: 4px 4px 0 0;
            box-shadow: inset 3px 0 5px rgba(255,255,255,0.05), inset -3px 0 5px rgba(0,0,0,0.4);
            transition: all 0.2s ease-out;
        }

        /* 3번 요구사항: 마우스 가까이 대면 책 한 권, 한 권에 은은하게 불 들어오기 */
        .giant-book:hover {
            filter: brightness(1.5);
            opacity: 1;
            cursor: pointer;
        }

        .h-max  { height: 680px; }
        .h-tall { height: 650px; }
        .h-mid  { height: 620px; }
        .h-low  { height: 590px; }
        .w-thin { width: 42px; }
        .w-reg  { width: 58px; }
        .w-wide { width: 78px; }

        /* 1번 요구사항: 너무 밝지도 어둡지도 않은 완벽한 밸런스의 미드톤 그레이 스케일 */
        .c-1 { background-color: #2b2b2b; } 
        .c-2 { background-color: #383838; }
        .c-3 { background-color: #454545; }
        .c-4 { background-color: #525252; }
        .c-5 { background-color: #606060; }
        .c-6 { background-color: #6e6e6e; }
        .c-7 { background-color: #7c7c7c; } 

        /* 4번 요구사항: 실제 공중전화 박스처럼 상단이 완전한 아치형인 루프 구조 */
        .booth-book-unit { 
            width: 420px; 
            height: 700px; 
            border: 16px solid #dc2626; 
            border-radius: 200px 200px 12px 12px; /* 상단 아치 프레임 */
            background: linear-gradient(180deg, #3a0d0d, #1a0505);
            box-shadow: 0 0 50px rgba(220, 38, 38, 0.25), inset 0 0 30px rgba(0, 0, 0, 0.8); 
            box-sizing: border-box;
            position: relative;
            z-index: 10; 
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 25px 25px 25px;
        }

        /* 4번 요구사항: 항상 순수 검정 배경을 유지하는 TELEPHONE 전구 박스 */
        .booth-sign {
            background-color: #000000; /* 항상 블랙 고정 */
            width: 80%;
            text-align: center;
            padding: 12px 0;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            gap: 6px;
            z-index: 10;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.9);
            margin-top: 25px;
            margin-bottom: 25px;
            border: 1px solid #1a1a1a;
        }

        /* 2번 요구사항: 얇은 Helvetica 300 굵기로 통일된 알파벳 전구 */
        .letter {
            font-family: "Helvetica Neue", Helvetica, sans-serif;
            font-weight: 300; 
            font-size: 22px;
            color: #220505; 
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .letter.active {
            color: #ffcc00; 
            text-shadow: 0 0 10px #ffbb00, 0 0 20px #ff5500;
        }

        .phone-machine-body {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        /* 2번 요구사항: 모든 타이포그래피 굵기를 명확하게 300으로 정렬 */
        h1 { font-size: 19px; margin: 0 0 4px 0; font-weight: 300; letter-spacing: 2px; text-align: center; color: #fff; }
        .subtitle { color: #8a6f6f; font-size: 11px; margin: 0 0 20px 0; font-weight: 300; letter-spacing: 1px; text-align: center; }

        .display { 
            width: 100%;
            background-color: #022c22; 
            border: 1px solid #065f46;
            border-radius: 10px;
            padding: 14px;
            font-family: 'Courier New', monospace;
            font-size: 24px; 
            color: #34d399; 
            margin-bottom: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        /* 2번 요구사항: 얇은 Helvetica 300 코인 버튼 */
        .btn-token { 
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #000; 
            border: none; 
            width: 100%;
            padding: 16px 0; 
            font-size: 15px; 
            font-family: "Helvetica Neue", Helvetica, sans-serif;
            font-weight: 300; 
            border-radius: 10px; 
            cursor: pointer; 
            z-index: 20;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn-token:active { transform: translateY(1px); }

        /* 2번 요구사항: 상단에서 톡 떨어져 바닥에 무작위 각도로 적층되는 물리 타이포 입자 */
        .falling-typo {
            position: absolute;
            font-family: "Helvetica Neue", Helvetica, sans-serif;
            font-weight: 300; /* 화이트 슬림 폰트 고정 */
            font-size: 12px;
            color: #ffffff; /* 순수 화이트 */
            letter-spacing: 2px;
            text-transform: uppercase;
            white-space: nowrap;
            pointer-events: none;
            z-index: 2;
            /* 위에서 아래로 중력 낙하하는 자연스러운 베지에 가속도 적용 */
            animation: dropPhysics 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* 2번 수정: dynamic CSS 변수를 통해 주입되는 무작위 낙하선 연출 규칙 */
        @keyframes dropPhysics {
            0% {
                top: 90px; /* 간판 바로 아래에서 스폰 */
                opacity: 0;
                transform: translate(-50%, 0) rotate(0deg);
            }
            15% {
                opacity: 1;
            }
            100% {
                top: var(--land-top); /* 랜덤 종착지(바닥 부근) */
                transform: translate(-50%, 0) rotate(var(--land-rot)); /* 랜덤 회전 각도 */
                opacity: 0.65;
            }
        }

        .hint { color: #525252; font-size: 10px; margin-top: auto; letter-spacing: 0.5px; text-align: center; z-index: 10; }
    </style>
</head>
<body>

    <div class="giant-shelf">
        
        <div class="book-group left">
            <div class="giant-book h-mid w-reg c-2"></div>
            <div class="giant-book h-tall w-thin c-4"></div>
            <div class="giant-book h-max w-wide c-1"></div>
            <div class="giant-book h-low w-reg c-6"></div>
            <div class="giant-book h-tall w-wide c-3"></div>
            <div class="giant-book h-mid w-thin c-7"></div>
            <div class="giant-book h-max w-reg c-5"></div>
            <div class="giant-book h-low w-wide c-4"></div>
        </div>

        <div class="booth-book-unit" id="boothBook">
            
            <div class="booth-sign">
                <span class="letter">T</span><span class="letter">E</span><span class="letter">L</span><span class="letter">E</span><span class="letter">P</span><span class="letter">H</span><span class="letter">O</span><span class="letter">N</span><span class="letter">E</span>
            </div>
            
            <div class="phone-machine-body">
                <h1>KAIST PHONE REFUGEES</h1>
                <div class="subtitle">STAIRWELL CALL STATION</div>
                <div class="display">🪙 TOKENS: <span id="count">0</span></div>
                <button class="btn-token" onclick="dropToken()">INSERT TOKEN</button>
            </div>

            <div class="hint">VOL. 1: THE REFUGEE</div>
        </div>

        <div class="book-group right">
            <div class="giant-book h-low w-wide c-4"></div>
            <div class="giant-book h-max w-reg c-5"></div>
            <div class="giant-book h-mid w-thin c-7"></div>
            <div class="giant-book h-tall w-wide c-3"></div>
            <div class="giant-book h-low w-reg c-6"></div>
            <div class="giant-book h-max w-wide c-1"></div>
            <div class="giant-book h-tall w-thin c-4"></div>
            <div class="giant-book h-mid w-reg c-2"></div>
        </div>

    </div>

    <script>
        let currentCount = localStorage.getItem('tokenCount') ? parseInt(localStorage.getItem('tokenCount')) : 0;
        document.getElementById('count').innerText = currentCount;
        updateLights(currentCount);

        // 전화 소리 파편 단어 스키마
        const phoneWords = ["RING", "HELLO?", "CONNECTED", "VOICE", "WHISPER", "SIGH", "BYE", "HEARING YOU", "CALLING"];

        function dropToken() {
            currentCount += 1;
            document.getElementById('count').innerText = currentCount;
            localStorage.setItem('tokenCount', currentCount);
            
            updateLights(currentCount);
            spawnFallingTypo(); // 2번 수정: 톡 떨어져 산처럼 쌓이는 기믹 실행
            
            alert("🪙 Clink! You made it through another day.");
        }

        function updateLights(count) {
            const letters = document.querySelectorAll('.letter');
            let litCount = Math.floor(count / 7); 
            letters.forEach((letter, index) => {
                if (index < litCount) letter.classList.add('active');
                else letter.classList.remove('active');
            });
        }

        // 2번 수정: 단어가 위에서 톡 떨어져 바닥 영역에 비정형 산 구조로 물리 적층되는 함수
        function spawnFallingTypo() {
            const booth = document.getElementById('boothBook');
            const el = document.createElement('div');
            el.className = 'falling-typo';
            el.innerText = phoneWords[Math.floor(Math.random() * phoneWords.length)];
            
            // 물리적인 불규칙 무작위 적층을 위한 변수 연산
            const landTop = Math.floor(Math.random() * 90) + 540; // 부스 하단 공간(540px~630px 사이)에 낙하 고정
            const landLeft = Math.floor(Math.random() * 200) + 110; // 부스 가로폭 내부(110px~310px 사이)로 분산
            const landRot = Math.floor(Math.random() * 60) - 30; // 무작위 경사 각도 생성 (-30도 ~ 30도)
            
            // CSS 변수 체인을 통해 동적 물리 렌더링 주입
            el.style.setProperty('--land-top', landTop + 'px');
            el.style.setProperty('--land-rot', landRot + 'deg');
            el.style.left = landLeft + 'px';
            
            booth.appendChild(el);

            // 화면 과부하 방지를 위한 자동 메모리 클리닝 (최대 40개 유지)
            const allTypos = booth.querySelectorAll('.falling-typo');
            if (allTypos.length > 40) {
                booth.removeChild(allTypos[0]);
            }
        }
    </script>
</body>
</html>
