<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAIST Phone Refugees</title>
    <style>
        /* 전체 배경을 어둡게 하고 중앙 정렬 */
        body { 
            background-color: #0b0f19; 
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 거대한 공중전화부스 스타일 */
        .booth { 
            width: 100%;
            max-width: 420px; 
            height: 700px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 12px solid #ef4444; /* 힙한 빨간색 공중전화부스 프레임 */
            border-radius: 20px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 40px rgba(239, 68, 68, 0.2);
            padding: 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        /* 부스 상단 유리창 느낌의 격자 무늬 배경 장식 */
        .booth::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 70px;
            pointer-events: none;
            border-radius: 8px;
        }

        /* 전화부스 간판 */
        .booth-sign {
            background-color: #fff;
            color: #000;
            width: 90%;
            text-align: center;
            padding: 8px 0;
            font-weight: 900;
            font-size: 18px;
            letter-spacing: 2px;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        /* 전화부스 내부 인터페이스 박스 */
        .phone-machine {
            width: 85%;
            background: #1e293b;
            border: 4px solid #475569;
            border-radius: 12px;
            padding: 25px 15px;
            text-align: center;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
            margin: auto 0;
        }

        h1 { 
            color: #38bdf8; 
            font-size: 22px; 
            margin: 0 0 5px 0;
        }
        
        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin: 0 0 25px 0;
        }

        /* 토큰 수량 디스플레이 (전화기 화면 느낌) */
        .display { 
            background-color: #052e16; 
            border: 2px solid #15803d;
            border-radius: 6px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 28px; 
            font-weight: bold; 
            color: #4ade80; 
            margin-bottom: 25px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
        }

        /* 투입 버튼 */
        .btn-token { 
            background: linear-gradient(135deg, #facc15, #ca8a04); /* 황금빛 동전 색상 */
            color: #000; 
            border: none; 
            width: 100%;
            padding: 16px 0; 
            font-size: 18px; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(250, 204, 21, 0.3);
        }
        
        .btn-token:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 20px rgba(250, 204, 21, 0.5);
        }
        
        .btn-token:active { 
            transform: translateY(1px); 
        }

        /* 하단 안내 가이드 문구 */
        .footer-text {
            color: #64748b;
            font-size: 11px;
            text-align: center;
            line-height: 1.4;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="booth">
        <div class="booth-sign">TELEPHONE</div>
        
        <div class="phone-machine">
            <h1>KAIST PHONE REFUGEES</h1>
            <div class="subtitle">Midterm Escape Station</div>
            
            <div class="display">🪙 TOKENS: <span id="count">12</span></div>
            
            <button class="btn-token" onclick="dropToken()">INSERT TOKEN</button>
            
            <div class="footer-text">
                Click to drop a token and record<br>your hidden escape today.
            </div>
        </div>
        
        <div style="color: #475569; font-size: 12px; letter-spacing: 1px;">KAIST ID SYSTEM</div>
    </div>

    <script>
        // 새로고침해도 숫자가 유지되도록 로컬 저장소 활용 (기본값 12개)
        let currentCount = localStorage.getItem('tokenCount') ? parseInt(localStorage.getItem('tokenCount')) : 12;
        document.getElementById('count').innerText = currentCount;

        function dropToken() {
            currentCount += 1;
            document.getElementById('count').innerText = currentCount;
            localStorage.setItem('tokenCount', currentCount);
            
            // 알림창도 요청하신 영어 문구로 반영되었습니다!
            alert("🪙 Clink! You made it through another day.");
        }
    </script>
</body>
</html>
