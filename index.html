<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAIST Phone Refugees</title>
    <style>
        body { 
            background-color: #0d0804; 
            color: #fff; 
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; 
            display: flex;
            justify-content: center;
            align-items: flex-end; 
            height: 100vh;
            margin: 0;
            overflow: hidden; 
        }

        /* 거대 도서관 책 선반 프레임 */
        .giant-shelf {
            width: 100vw;
            height: 740px; 
            display: flex;
            align-items: flex-end;
            justify-content: center; 
            border-bottom: 24px solid #5c3a21; 
            box-shadow: 
                inset 0 80px 150px rgba(0,0,0,0.95),
                inset 0 -20px 40px rgba(0,0,0,0.6);
            position: relative;
            box-sizing: border-box;
            background: linear-gradient(180deg, #1f140a, #0d0804); 
        }

        /* 좌우 균형 1:1 대칭 매칭 정중앙 고정 */
        .book-group {
            flex-grow: 1;
            flex-basis: 0;
            display: flex;
            align-items: flex-end;
            gap: 2px;
            overflow: hidden;
            box-sizing: border-box;
            opacity: 0.4;
        }
        
        .book-group.left { justify-content: flex-end; padding-right: 15px; }
        .book-group.right { justify-content: flex-start; padding-left: 15px; }

        .giant-book {
            flex-shrink: 0;
            border-radius: 4px 4px 0 0;
            box-shadow: inset 3px 0 5px rgba(255,255,255,0.05), inset -3px 0 5px rgba(0,0,0,0.4);
            transition: all 0.2s ease-out;
        }

        .giant-book:hover {
            filter: brightness(1.5);
            opacity: 1;
            cursor: pointer;
        }

        .h-max  { height: 680px; }
        .h-tall { height: 650px; }
        .h-mid  { height: 620px; }
        .h-low  { height: 590px; }
        .w-thin { width: 42px; }
        .w-reg  { width: 58px; }
        .w-wide { width: 78px; }

        /* 컨펌된 명도의 미드톤 그레이 스케일 */
        .c-1 { background-color: #2b2b2b; } 
        .c-2 { background-color: #383838; }
        .c-3 { background-color: #454545; }
        .c-4 { background-color: #525252; }
        .c-5 { background-color: #606060; }
        .c-6 { background-color: #6e6e6e; }
        .c-7 { background-color: #7c7c7c; } 

        /* 상단 아치형 공중전화부스 장서 */
        .booth-book-unit { 
            width: 420px; 
            height: 700px; 
            border: 16px solid #dc2626; 
            border-radius: 200px 200px 12px 12px; 
            background: linear-gradient(180deg, #3a0d0d, #1a0505);
            box-shadow: 0 0 50px rgba(220, 38, 38, 0.25), inset 0 0 30px rgba(0, 0, 0, 0.8); 
            box-sizing: border-box;
            position: relative;
            z-index: 10; 
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 25px 25px 25px;
            overflow: hidden;
        }

        /* 항상 순수 검정 배경 유지 TELEPHONE 전구 박스 */
        .booth-sign {
            background-color: #000000; 
            width: 80%;
            text-align: center;
            padding: 12px 0;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            gap: 6px;
            z-index: 10;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.9);
            margin-top: 25px;
            margin-bottom: 25px;
            border: 1px solid #1a1a1a;
        }

        /* 얇은 Helvetica 300 전구 알파벳 */
        .letter {
            font-family: "Helvetica Neue", Helvetica, sans-serif;
            font-weight: 300; 
            font-size: 22px;
            color: #220505; 
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .letter.active {
            color: #ffcc00; 
            text-shadow: 0 0 10px #ffbb00, 0 0 20px #ff5500;
        }

        .phone-machine-body {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        h1 { font-size: 19px; margin: 0 0 4px 0; font-weight: 300; letter-spacing: 2px; text-align: center; color: #fff; }
        .subtitle { color: #8a6f6f; font-size: 11px; margin: 0 0 20px 0; font-weight: 300; letter-spacing: 1px; text-align: center; }

        .display { 
            width: 100%;
            background-color: #022c22; 
            border: 1px solid #065f46;
            border-radius: 10px;
            padding: 14px;
            font-family: 'Courier New', monospace;
            font-size: 24px; 
            color: #34d399; 
            margin-bottom: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        /* 얇은 Helvetica 300 코인 버튼 */
        .btn-token { 
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #000; 
            border: none; 
            width: 100%;
            padding: 16px 0; 
            font-size: 15px; 
            font-family: "Helvetica Neue", Helvetica, sans-serif;
            font-weight: 300; 
            border-radius: 10px; 
            cursor: pointer; 
            z-index: 20;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn-token:active { transform: translateY(1px); }

        /* 실시간 자연스러운 댐핑 물리용 타이포 사양 (Thin White 300) */
        .falling-typo {
            position: absolute;
            font-family: "Helvetica Neue", Helvetica, sans-serif;
            font-weight: 300; 
            font-size: 11px;
            color: #ffffff; 
            letter-spacing: 1px;
            white-space: nowrap;
            pointer-events: none;
            z-index: 2;
            transform-origin: center center;
        }

        .hint { color: #525252; font-size: 10px; margin-top: auto; letter-spacing: 0.5px; text-align: center; z-index: 10; }
    </style>
</head>
<body>

    <div class="giant-shelf">
        
        <div class="book-group left">
            <div class="giant-book h-mid w-reg c-2"></div>
            <div class="giant-book h-tall w-thin c-4"></div>
            <div class="giant-book h-max w-wide c-1"></div>
            <div class="giant-book h-low w-reg c-6"></div>
            <div class="giant-book h-tall w-wide c-3"></div>
            <div class="giant-book h-mid w-thin c-7"></div>
            <div class="giant-book h-max w-reg c-5"></div>
            <div class="giant-book h-low w-wide c-4"></div>
        </div>

        <div class="booth-book-unit" id="boothBook">
            
            <div class="booth-sign">
                <span class="letter">T</span><span class="letter">E</span><span class="letter">L</span><span class="letter">E</span><span class="letter">P</span><span class="letter">H</span><span class="letter">O</span><span class="letter">N</span><span class="letter">E</span>
            </div>
            
            <div class="phone-machine-body">
                <h1>KAIST PHONE REFUGEES</h1>
                <div class="subtitle">STAIRWELL CALL STATION</div>
                <div class="display">🪙 TOKENS: <span id="count">0</span></div>
                <button class="btn-token" onclick="dropToken()">INSERT TOKEN</button>
            </div>

            <div class="hint">VOL. 1: THE REFUGEE</div>
        </div>

        <div class="book-group right">
            <div class="giant-book h-low w-wide c-4"></div>
            <div class="giant-book h-max w-reg c-5"></div>
            <div class="giant-book h-mid w-thin c-7"></div>
            <div class="giant-book h-tall w-wide c-3"></div>
            <div class="giant-book h-low w-reg c-6"></div>
            <div class="giant-book h-max w-wide c-1"></div>
            <div class="giant-book h-tall w-thin c-4"></div>
            <div class="giant-book h-mid w-reg c-2"></div>
        </div>

    </div>

    <script>
        // 새로고침 시 이어서 사용할 수 있는 영구 누적 메커니즘
        let currentCount = localStorage.getItem('tokenCount') ? parseInt(localStorage.getItem('tokenCount')) : 0;
        
        document.getElementById('count').innerText = currentCount;
        updateLights(currentCount);

        const phoneWords = [
            "I'm doing well. And you?", "Same old, same old.", "Not too bad, thanks.",
            "Surviving, barely.", "Could be better.", "Just hanging in there.",
            "Exhausted but okay.", "Pretty good, actually.", "Missing home a bit.",
            "Just need a break.", "Hang on, talk tomorrow.", "Yeah, I'm staying up."
        ];
        
        let particles = [];

        // 페이지 로드 시 기존 글자 무덤 완벽 복구
        window.addEventListener('DOMContentLoaded', () => {
            let savedParticles = localStorage.getItem('phoneParticles') ? JSON.parse(localStorage.getItem('phoneParticles')) : [];
            savedParticles.forEach(sp => {
                reconstructParticle(sp.text, sp.x, sp.y, sp.angle);
            });
        });

        function dropToken() {
            currentCount += 1;
            
            // TELEPHONE 완점(63개 초과) 시에만 초기화
            if (currentCount > 63) {
                currentCount = 0;
                document.querySelectorAll('.falling-typo').forEach(el => el.remove());
                particles = [];
                localStorage.removeItem('tokenCount');
                localStorage.removeItem('phoneParticles');
                document.getElementById('count').innerText = currentCount;
                updateLights(currentCount);
                alert("☎️ TELEPHONE is fully illuminated! The archive loops back to 0.");
                return;
            }
            
            document.getElementById('count').innerText = currentCount;
            localStorage.setItem('tokenCount', currentCount);
            updateLights(currentCount);
            
            if (currentCount > 0) {
                spawnPhysicsTypo(); 
            }
            
            alert("🪙 Clink! You made it through another day.");
        }

        function updateLights(count) {
            const letters = document.querySelectorAll('.letter');
            let litCount = Math.floor(count / 7); 
            letters.forEach((letter, index) => {
                if (index < litCount) letter.classList.add('active');
                else letter.classList.remove('active');
            });
        }

        function spawnPhysicsTypo() {
            const booth = document.getElementById('boothBook');
            const el = document.createElement('div');
            el.className = 'falling-typo';
            let txt = phoneWords[Math.floor(Math.random() * phoneWords.length)];
            el.innerText = txt;
            booth.appendChild(el);
            
            particles.push({
                el: el,
                text: txt,
                x: 210 + (Math.random() * 16 - 8), 
                y: 110,                             
                vx: Math.random() * 1 - 0.5,          
                vy: 15, 
                angle: Math.random() * 8 - 4,     
                va: Math.random() * 2 - 1,          
                radiusH: 55, 
                radiusV: 12,
                isSleeping: false            
            });
        }

        function reconstructParticle(text, x, y, angle) {
            const booth = document.getElementById('boothBook');
            const el = document.createElement('div');
            el.className = 'falling-typo';
            el.innerText = text;
            el.style.top = y + 'px';
            el.style.left = x + 'px';
            el.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
            booth.appendChild(el);
            
            particles.push({
                el: el,
                text: text,
                x: x, y: y, vx: 0, vy: 0, angle: angle, va: 0,
                radiusH: 55, radiusV: 12
            });
        }

        function updatePhysicsLoop() {
            const gravity = 0.55; 
            const floorY = 655;   

            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                
                if (p.isSleeping) continue;
                
                p.vy += gravity;
                p.x += p.vx;
                p.y += p.vy;
                p.angle += p.va;

                p.vx *= 0.90;
                p.vy *= 0.92;
                p.va *= 0.88;

                if (p.x < 70) { p.x = 70; p.vx = -p.vx * 0.1; }
                if (p.x > 350) { p.x = 350; p.vx = -p.vx * 0.1; }

                /* 🛠️ 수정 핵심: 바닥 마찰력 극대화 제어 (0.6 ➡️ 0.05) */
                if (p.y > floorY) {
                    p.y = floorY;
                    p.vy = -p.vy * 0.02; 
                    p.vx *= 0.05;        /* 👈 바닥에 닿자마자 미끄러짐을 완벽하게 차단 */
                    p.va *= 0.05;        /* 👈 회전하며 구르는 현상 최소화 */
                    p.isSleeping = true;
                }

                // 타 글자체 오브제와의 안정적인 포개짐 연산
                for (let j = 0; j < particles.length; j++) {
                    if (i === j) continue;
                    let other = particles[j];

                    let dx = p.x - other.x;
                    let dy = p.y - other.y;
                    let hDist = Math.abs(dx);
                    let vDist = Math.abs(dy);

                    let minH = (p.radiusH + other.radiusH) * 0.62;
                    let minV = 15; 

                    if (hDist < minH && vDist < minV) {
                        let overlapX = minH - hDist;
                        let overlapY = minV - vDist;

                        if (overlapY < overlapX) {
                            if (dy > 0) {
                                p.y += overlapY * 0.15; 
                            } else {
                                p.y -= overlapY * 0.15;
                            }
                            p.vy *= 0.3; 
                            p.vx += dx * 0.01; /* 옆으로 과하게 미끄러지지 않도록 가로 분산력 억제 */
                        } else {
                            p.x += (dx > 0 ? 1 : -1) * overlapX * 0.1;
                            p.vx *= 0.2;
                        }
                    }
                }

                p.el.style.top = p.y + 'px';
                p.el.style.left = p.x + 'px';
                p.el.style.transform = `translate(-50%, -50%) rotate(${p.angle}deg)`;
            }

            if (particles.length > 55) {
                const dead = particles.shift();
                if(dead && dead.el.parentNode) dead.el.parentNode.removeChild(dead.el);
            }

            if (particles.length > 0 && Math.random() < 0.05) { 
                let stateArray = particles.map(p => ({text: p.text, x: p.x, y: p.y, angle: p.angle}));
                localStorage.setItem('phoneParticles', JSON.stringify(stateArray));
            }

            requestAnimationFrame(updatePhysicsLoop);
        }

        requestAnimationFrame(updatePhysicsLoop);
    </script>
</body>
</html>
