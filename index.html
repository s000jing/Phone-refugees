<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAIST Phone Refugees</title>
    <style>
        /* 기본 배경 및 폰트 설정 (Helvetica 유지) */
        body { 
            background-color: #000000; 
            color: #fff; 
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden; 
        }

        /* 📚 거대한 도서관 책장 프레임 (3D 입체감) */
        .library-frame {
            width: 90%;
            max-width: 1200px;
            height: 80vh;
            background: linear-gradient(135deg, #1f140a, #0f0a05); /* 깊은 원목 톤 */
            border: 12px solid #2d1e13;
            border-radius: 20px;
            box-shadow: 
                0 30px 60px rgba(0,0,0,0.8),
                inset 0 0 40px rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center; /* 세로 중앙 정렬로 전화부스 칸 노출 */
            position: relative;
        }

        /* 🪟 전화부스가 들어있는 '한 칸' (책 선반) */
        .special-shelf {
            width: 100%;
            display: flex;
            align-items: flex-end; /* 모든 요소를 선반 바닥에 맞춤 */
            justify-content: center;
            padding: 0 40px;
            box-sizing: border-box;
            position: relative;
        }

        /* 선반 나무 바닥 (3D 입체감) */
        .special-shelf::after {
            content: '';
            position: absolute;
            bottom: -15px; /* 선반 나무 두께 */
            left: 20px; right: 20px;
            height: 15px;
            background: linear-gradient(180deg, #3d291a, #1f140a);
            border-radius: 0 0 8px 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        /* 선반 안쪽 뒷벽 그림자 연출 */
        .shelf-shadow-top {
            position: absolute;
            top: 20px; left: 20px; right: 20px; height: 30px;
            background: linear-gradient(180deg, rgba(0,0,0,0.8), transparent);
            pointer-events: none;
        }

        /* 📖 좌우로 주루룩 꽂힌 일반 서적들 */
        .book-row {
            flex: 1;
            display: flex;
            align-items: flex-end;
            gap: 2px;
            padding-bottom: 5px; /* 선반 바닥에서 살짝 띄움 */
            max-width: 300px;
            opacity: 0.4; /* 전화부스를 돋보이게 */
        }
        
        /* 모바일에서는 책 숨기기 */
        @media (max-width: 900px) {
            .book-row { display: none; }
        }

        /* 서적 공통 스타일 */
        .book {
            display: inline-block;
            border-radius: 3px 3px 0 0;
            box-shadow: inset 3px 0 5px rgba(255,255,255,0.05), inset -3px 0 5px rgba(0,0,0,0.4);
        }

        /* 서적 컬러 스키마 (Muted tone) */
        .b-deepblue  { background-color: #1a365d; width: 18px; height: 220px; }
        .b-darkgreen { background-color: #164e63; width: 22px; height: 250px; }
        .b-wine      { background-color: #5b21b6; width: 15px; height: 180px; }
        .b-brown     { background-color: #78350f; width: 24px; height: 230px; }
        .b-slate     { background-color: #475569; width: 20px; height: 200px; }
        .b-navy      { background-color: #171717; width: 16px; height: 240px; }

        /* 📞 책처럼 꽂힌 커다란 빨간색 전화부스 (주인공) */
        .booth-as-book { 
            width: 420px; /* 기존 부스 너비 유지 */
            height: 680px;
            background: linear-gradient(180deg, #2a0808, #000000);
            border: 16px solid #dc2626; /* 거대한 빨간 프레임 */
            border-radius: 20px; 
            box-shadow: 0 0 50px rgba(220, 38, 38, 0.3), inset 0 0 40px rgba(0, 0, 0, 1); 
            padding: 40px 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 10; /* 책들보다 위에 */
            margin: 0 20px; /* 양옆 책들과의 간격 */
        }

        /* 전화 타이포 레이어 */
        #word-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 2;
        }

        .floating-word {
            position: absolute;
            font-weight: 200; 
            font-size: 13px;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 0.35; transform: scale(1); }
        }

        /* 얇은 폰트 두께 반영 완료 */
        h1 { 
            font-size: 20px; 
            margin: 0 0 6px 0; 
            font-weight: 200; 
            letter-spacing: 2px;
            text-align: center;
            z-index: 10;
        }

        .subtitle { 
            color: #737373; 
            font-size: 11px; 
            margin: 0 0 25px 0; 
            font-weight: 300; 
            letter-spacing: 1px;
            text-align: center;
            z-index: 10;
        }

        .booth-sign {
            background-color: #110303;
            width: 100%;
            text-align: center;
            padding: 14px 0;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            gap: 6px;
            z-index: 10;
        }

        .letter {
            font-weight: 900;
            font-size: 24px;
            color: #3a1515; 
            transition: all 0.3s ease;
        }

        .letter.active {
            color: #ffcc00; 
            text-shadow: 0 0 12px #ffbb00;
        }

        .phone-machine {
            width: 90%;
            background: rgba(23, 23, 23, 0.85);
            backdrop-filter: blur(5px);
            border-radius: 25px;
            padding: 30px 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid #333;
            text-align: center;
            z-index: 10;
        }

        .display { 
            background-color: #022c22; 
            border: 1px solid #065f46;
            border-radius: 12px;
            padding: 16px;
            font-family: 'Courier New', monospace;
            font-size: 26px; 
            color: #34d399; 
            margin-bottom: 25px;
        }

        /* 얇은 두께 반영 완료 */
        .btn-token { 
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #000; 
            border: none; 
            width: 100%;
            padding: 18px 0; 
            font-size: 16px; 
            font-weight: 300; 
            border-radius: 12px; 
            cursor: pointer; 
            z-index: 20;
            font-family: "Helvetica Neue", Helvetica, sans-serif;
            letter-spacing: 1px;
        }

        .btn-token:active { transform: translateY(1px); }
        .hint { color: #525252; font-size: 10px; margin-top: 15px; letter-spacing: 0.5px; }
    </style>
</head>
<body>

    <div class="library-frame">
        <div class="shelf-shadow-top"></div>

        <div class="special-shelf">
            
            <div class="book-row">
                <div class="book b-deepblue"></div><div class="book b-darkgreen"></div><div class="book b-wine"></div><div class="book b-brown"></div><div class="book b-slate"></div><div class="book b-navy"></div>
            </div>

            <div class="booth-as-book">
                <div id="word-layer"></div> 

                <div class="booth-sign">
                    <span class="letter">T</span><span class="letter">E</span><span class="letter">L</span><span class="letter">E</span><span class="letter">P</span><span class="letter">H</span><span class="letter">O</span><span class="letter">N</span><span class="letter">E</span>
                </div>
                
                <div class="phone-machine">
                    <h1>KAIST PHONE REFUGEES</h1>
                    <div class="subtitle">STAIRWELL CALL STATION</div>
                    <div class="display">🪙 TOKENS: <span id="count">0</span></div>
                    <button class="btn-token" onclick="dropToken()">INSERT TOKEN</button>
                    <div class="hint">Check in your call.</div>
                </div>
                <div style="color: #444; font-size: 10px; font-weight: 300; letter-spacing: 2px; z-index: 10;">THE REFUGEE'S BOOK</div>
            </div>

            <div class="book-row">
                <div class="book b-navy"></div><div class="book b-slate"></div><div class="book b-wine"></div><div class="book b-brown"></div><div class="book b-darkgreen"></div><div class="book b-deepblue"></div>
            </div>

        </div>

    </div>

    <script>
        let currentCount = localStorage.getItem('tokenCount') ? parseInt(localStorage.getItem('tokenCount')) : 0;
        document.getElementById('count').innerText = currentCount;
        updateLights(currentCount);

        // 전화 소리 파편 단어들
        const phoneWords = ["RING", "HELLO?", "CONNECTED", "VOICE", "WHISPER", "SIGH", "BYE", "HEARING YOU", "CALLING"];

        function dropToken() {
            currentCount += 1;
            document.getElementById('count').innerText = currentCount;
            localStorage.setItem('tokenCount', currentCount);
            updateLights(currentCount);
            createPhoneWordParticle();
            alert("🪙 Clink! You made it through another day.");
        }

        function updateLights(count) {
            const letters = document.querySelectorAll('.letter');
            let litCount = Math.floor(count / 7); 
            letters.forEach((letter, index) => {
                if (index < litCount) letter.classList.add('active');
                else letter.classList.remove('active');
            });
        }

        function createPhoneWordParticle() {
            const layer = document.getElementById('word-layer');
            const span = document.createElement('span');
            span.innerText = phoneWords[Math.floor(Math.random() * phoneWords.length)];
            span.className = 'floating-word';
            span.style.left = Math.random() * 85 + 5 + '%';
            span.style.top = Math.random() * 85 + 5 + '%';
            layer.appendChild(span);

            if(layer.children.length > 35) {
                layer.removeChild(layer.firstChild);
            }
        }
    </script>
</body>
</html>
