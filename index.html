<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAIST Phone Refugees</title>
    <style>
        /* 완벽한 블랙 배경, 화면 스크롤 제거 */
        body { 
            background-color: #000000; 
            color: #fff; 
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; 
            display: flex;
            justify-content: center;
            align-items: flex-end; /* 모든 책과 부스를 화면 바닥에 정렬 */
            height: 100vh;
            margin: 0;
            overflow: hidden; 
        }

        /* 📚 가로로 화면을 100% 꽉 채우는 거대 책 선반 (원목 바닥 느낌) */
        .giant-shelf {
            width: 100vw;
            height: 720px; /* 부스 높이(680px)를 수용하는 선반 높이 */
            display: flex;
            align-items: flex-end;
            justify-content: center;
            border-bottom: 24px solid #2d1e13; /* 화면 맨 밑을 꽉 채우는 두꺼운 책장 나무 프레임 */
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.8);
            position: relative;
            box-sizing: border-box;
        }

        /* 📖 좌우로 빽빽하게 화면 끝까지 차오르는 거대 서적 컨테이너 */
        .book-group {
            flex: 1;
            display: flex;
            align-items: flex-end;
            gap: 2px; /* 책끼리 빈틈없이 붙도록 유격 최소화 */
            overflow: hidden;
            opacity: 0.25; /* 전화부스 서적이 돋보이도록 주변 서적은 딥하게 톤다운 */
            transition: opacity 0.3s ease;
        }
        .book-group:hover {
            opacity: 0.45; /* 마우스 올리면 은은하게 도서관 책들이 드러남 */
        }
        
        .book-group.left { justify-content: flex-end; }
        .book-group.right { justify-content: flex-start; }

        /* 거대 서적 공통 스타일 (부스 크기와 유사하도록 600px 이상의 거대 크기) */
        .giant-book {
            flex-shrink: 0;
            border-radius: 6px 6px 0 0;
            box-shadow: 
                inset 5px 0 7px rgba(255,255,255,0.03), 
                inset -5px 0 7px rgba(0,0,0,0.6);
        }

        /* 680px 부스 서적과 높이가 전반적으로 유사한 높이 바리에이션 */
        .h-max  { height: 680px; }
        .h-tall { height: 660px; }
        .h-mid  { height: 640px; }
        .h-low  { height: 620px; }

        /* 책 두께(너비) 바리에이션 */
        .w-thin { width: 40px; }
        .w-reg  { width: 55px; }
        .w-wide { width: 75px; }

        /* 도서관 특유의 무겁고 아카이브된 컬러 칩 */
        .c-navy      { background-color: #0f172a; }
        .c-darkgreen { background-color: #064e3b; }
        .c-wine      { background-color: #4c1d95; }
        .c-brown     { background-color: #451a03; }
        .c-slate     { background-color: #334155; }
        .c-deepblue  { background-color: #1e3a8a; }
        .c-charcoal  { background-color: #171717; }

        /* 📞 책장에 함께 꽂힌 '한 권의 거대한 책'이 된 전화부스 */
        .booth-book { 
            width: 420px; 
            height: 680px; /* 거대 서적들과 완벽히 매칭되는 패널 높이 */
            background: linear-gradient(180deg, #2a0808, #000000);
            border: 16px solid #dc2626; /* 강렬한 빨간색 서적 표지 프레임 */
            border-radius: 12px 12px 0 0; /* 책 윗부분 라운딩 느낌 */
            box-shadow: 0 0 60px rgba(220, 38, 38, 0.35), inset 0 0 40px rgba(0, 0, 0, 1); 
            padding: 40px 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 10; /* 양옆 책들 위로 그림자가 덮이도록 최상위 레이어 설정 */
            margin: 0 4px;
        }

        /* 전화 타이포 레이어 */
        #word-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 2;
        }

        .floating-word {
            position: absolute;
            font-weight: 200; 
            font-size: 13px;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 0.35; transform: scale(1); }
        }

        /* 세련되고 얇은 Helvetica 타이포 디자인 */
        h1 { 
            font-size: 20px; 
            margin: 0 0 6px 0; 
            font-weight: 200; 
            letter-spacing: 2px;
            text-align: center;
            z-index: 10;
        }

        .subtitle { 
            color: #737373; 
            font-size: 11px; 
            margin: 0 0 25px 0; 
            font-weight: 300; 
            letter-spacing: 1px;
            text-align: center;
            z-index: 10;
        }

        .booth-sign {
            background-color: #110303;
            width: 100%;
            text-align: center;
            padding: 14px 0;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            gap: 6px;
            z-index: 10;
        }

        .letter {
            font-weight: 900;
            font-size: 24px;
            color: #3a1515; 
            transition: all 0.3s ease;
        }

        .letter.active {
            color: #ffcc00; 
            text-shadow: 0 0 12px #ffbb00;
        }

        .phone-machine {
            width: 90%;
            background: rgba(23, 23, 23, 0.85);
            backdrop-filter: blur(5px);
            border-radius: 25px;
            padding: 30px 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid #333;
            text-align: center;
            z-index: 10;
        }

        .display { 
            background-color: #022c22; 
            border: 1px solid #065f46;
            border-radius: 12px;
            padding: 16px;
            font-family: 'Courier New', monospace;
            font-size: 26px; 
            color: #34d399; 
            margin-bottom: 25px;
        }

        /* 얇은 가독성의 버튼 스타일 */
        .btn-token { 
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #000; 
            border: none; 
            width: 100%;
            padding: 18px 0; 
            font-size: 16px; 
            font-weight: 300; 
            border-radius: 12px; 
            cursor: pointer; 
            z-index: 20;
            font-family: "Helvetica Neue", Helvetica, sans-serif;
            letter-spacing: 1px;
        }

        .btn-token:active { transform: translateY(1px); }
        .hint { color: #525252; font-size: 10px; margin-top: 15px; letter-spacing: 0.5px; }
    </style>
</head>
<body>

    <div class="giant-shelf">
        
        <div class="book-group left">
            <div class="giant-book h-mid w-reg c-navy"></div>
            <div class="giant-book h-tall w-thin c-wine"></div>
            <div class="giant-book h-max w-wide c-brown"></div>
            <div class="giant-book h-low w-reg c-slate"></div>
            <div class="giant-book h-tall w-wide c-darkgreen"></div>
            <div class="giant-book h-mid w-thin c-charcoal"></div>
            <div class="giant-book h-max w-reg c-deepblue"></div>
            <div class="giant-book h-low w-wide c-wine"></div>
            <div class="giant-book h-tall w-thin c-brown"></div>
            <div class="giant-book h-mid w-reg c-slate"></div>
            <div class="giant-book h-max w-wide c-navy"></div>
            <div class="giant-book h-low w-thin c-darkgreen"></div>
            <div class="giant-book h-tall w-reg c-charcoal"></div>
        </div>

        <div class="booth-book">
            <div id="word-layer"></div> 

            <div class="booth-sign">
                <span class="letter">T</span><span class="letter">E</span><span class="letter">L</span><span class="letter">E</span><span class="letter">P</span><span class="letter">H</span><span class="letter">O</span><span class="letter">N</span><span class="letter">E</span>
            </div>
            
            <div class="phone-machine">
                <h1>KAIST PHONE REFUGEES</h1>
                <div class="subtitle">STAIRWELL CALL STATION</div>
                <div class="display">🪙 TOKENS: <span id="count">0</span></div>
                <button class="btn-token" onclick="dropToken()">INSERT TOKEN</button>
                <div class="hint">Check in your call.</div>
            </div>
            <div style="color: #444; font-size: 10px; font-weight: 300; letter-spacing: 2px; z-index: 10;">VOL. 1: THE REFUGEE</div>
        </div>

        <div class="book-group right">
            <div class="giant-book h-tall w-reg c-charcoal"></div>
            <div class="giant-book h-max w-wide c-deepblue"></div>
            <div class="giant-book h-low w-thin c-wine"></div>
            <div class="giant-book h-mid w-reg c-brown"></div>
            <div class="giant-book h-tall w-wide c-slate"></div>
            <div class="giant-book h-low w-thin c-darkgreen"></div>
            <div class="giant-book h-max w-reg c-navy"></div>
            <div class="giant-book h-mid w-wide c-wine"></div>
            <div class="giant-book h-tall w-thin c-charcoal"></div>
            <div class="giant-book h-max w-reg c-brown"></div>
            <div class="giant-book h-low w-wide c-deepblue"></div>
            <div class="giant-book h-tall w-thin c-slate"></div>
            <div class="giant-book h-mid w-reg c-darkgreen"></div>
        </div>

    </div>

    <script>
        let currentCount = localStorage.getItem('tokenCount') ? parseInt(localStorage.getItem('tokenCount')) : 0;
        document.getElementById('count').innerText = currentCount;
        updateLights(currentCount);

        const phoneWords = ["RING", "HELLO?", "CONNECTED", "VOICE", "WHISPER", "SIGH", "BYE", "HEARING YOU", "CALLING"];

        function dropToken() {
            currentCount += 1;
            document.getElementById('count').innerText = currentCount;
            localStorage.setItem('tokenCount', currentCount);
            updateLights(currentCount);
            createPhoneWordParticle();
            alert("🪙 Clink! You made it through another day.");
        }

        function updateLights(count) {
            const letters = document.querySelectorAll('.letter');
            let litCount = Math.floor(count / 7); 
            letters.forEach((letter, index) => {
                if (index < litCount) letter.classList.add('active');
                else letter.classList.remove('active');
            });
        }

        function createPhoneWordParticle() {
            const layer = document.getElementById('word-layer');
            const span = document.createElement('span');
            span.innerText = phoneWords[Math.floor(Math.random() * phoneWords.length)];
            span.className = 'floating-word';
            span.style.left = Math.random() * 85 + 5 + '%';
            span.style.top = Math.random() * 85 + 5 + '%';
            layer.appendChild(span);

            if(layer.children.length > 35) {
                layer.removeChild(layer.firstChild);
            }
        }
    </script>
</body>
</html>
