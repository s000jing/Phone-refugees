<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAIST Phone Refugees</title>
    <style>
        body { 
            background-color: #0f172a; 
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 3D 민트색 공중전화부스 */
        .booth { 
            width: 100%;
            max-width: 430px; 
            background: linear-gradient(135deg, #4da6a6, #2d6a6a); /* 민트색 그라데이션 */
            border-radius: 40px; /* 라운드 형태 강조 */
            padding: 30px 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.6),
                inset 5px 5px 15px rgba(255,255,255,0.3),  /* 3D 볼륨감 하이라이트 */
                inset -5px -5px 15px rgba(0,0,0,0.3);
            border: 4px solid #3d8b8b;
        }

        /* TELEPHONE 간판 및 알파벳 개별 스타일 */
        .booth-sign {
            background-color: #1a3a3a;
            width: 90%;
            text-align: center;
            padding: 12px 0;
            border-radius: 15px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5), 0 4px 10px rgba(0,0,0,0.3);
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            gap: 4px;
        }

        .letter {
            font-weight: 900;
            font-size: 24px;
            letter-spacing: 1px;
            color: #2a4a4a; /* 기본 꺼진 상태 (어두운 색) */
            transition: all 0.4s ease;
            text-shadow: none;
        }

        /* 불 켜진 알파벳 스타일 */
        .letter.active {
            color: #fffb00; /* 환한 노란색 */
            text-shadow: 0 0 10px #ffea00, 0 0 20px #ffaa00;
        }

        /* 전화기 본체 */
        .phone-machine {
            width: 90%;
            background: #222;
            border-radius: 20px;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.1);
            border: 2px solid #333;
        }

        h1 { color: #22d3ee; font-size: 20px; margin: 0 0 5px 0; text-align: center; }
        .subtitle { color: #94a3b8; font-size: 13px; margin: 0 0 20px 0; text-align: center; }

        /* 토큰 디스플레이 (계측기 화면 느낌) */
        .display { 
            background-color: #022c22; 
            border: 2px solid #065f46;
            border-radius: 10px;
            padding: 12px;
            font-family: monospace;
            font-size: 26px; 
            font-weight: bold; 
            color: #34d399; 
            margin-bottom: 20px;
            text-align: center;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        /* 황금 토큰 버튼 */
        .btn-token { 
            background: linear-gradient(135deg, #fbbf24, #b45309);
            color: #000; 
            border: none; 
            width: 100%;
            padding: 15px 0; 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 10px; 
            cursor: pointer; 
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(180, 83, 9, 0.3);
        }
        .btn-token:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(250, 204, 21, 0.4); }
        .btn-token:active { transform: translateY(1px); }

        /* 영수증(메시지 리스트) 나오는 구멍 디자인 */
        .receipt-slot {
            width: 90%;
            height: 6px;
            background-color: #000;
            margin: 25px auto 0 auto;
            border-radius: 3px;
            box-shadow: 0 2px 5px rgba(255,255,255,0.1);
        }

        /* 찌리릭 나오는 영수증 보드 */
        .receipt-paper {
            width: 85%;
            background-color: #f8fafc;
            color: #334155;
            border-radius: 0 0 10px 10px;
            padding: 15px;
            box-sizing: border-box;
            max-height: 180px;
            overflow-y: auto;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            font-size: 13px;
            font-family: monospace;
            border-top: 1px dashed #cbd5e1;
            animation: slideDown 0.5s ease-out;
        }

        @keyframes slideDown {
            from { max-height: 0; padding-top: 0; padding-bottom: 0; }
            to { max-height: 180px; }
        }

        .msg-item {
            border-bottom: 1px dotted #cbd5e1;
            padding: 6px 0;
            line-height: 1.4;
        }
        .msg-item:last-child { border-bottom: none; }
    </style>
</head>
<body>

    <div class="booth">
        <div class="booth-sign" id="signBoard">
            <span class="letter">T</span>
            <span class="letter">E</span>
            <span class="letter">L</span>
            <span class="letter">E</span>
            <span class="letter">P</span>
            <span class="letter">H</span>
            <span class="letter">O</span>
            <span class="letter">N</span>
            <span class="letter">E</span>
        </div>
        
        <div class="phone-machine">
            <h1>KAIST PHONE REFUGEES</h1>
            <div class="subtitle">Digital Escape Archive</div>
            
            <div class="display">🪙 TOKENS: <span id="count">0</span></div>
            
            <button class="btn-token" onclick="dropToken()">INSERT TOKEN</button>
        </div>

        <div class="receipt-slot"></div>
        <div class="receipt-paper" id="msgBoard">
            <div style="text-align: center; color: #94a3b8; font-size: 11px;">[ Archived Solitudes ]</div>
        </div>
    </div>

    <script>
        // 새로고침해도 데이터 유지 (초기값 토큰 0개)
        let currentCount = localStorage.getItem('tokenCount') ? parseInt(localStorage.getItem('tokenCount')) : 0;
        let savedMessages = localStorage.getItem('phoneMsgs') ? JSON.parse(localStorage.getItem('phoneMsgs')) : [];
        
        document.getElementById('count').innerText = currentCount;
        updateLights(currentCount);
        renderMessages();

        function dropToken() {
            // 3번 아이디어: 지정된 텍스트로 질문 창 띄우기
            let userMsg = prompt("How was your day?");
            
            // 취소 버튼을 누르거나 아무것도 안 적었을 때 예외 처리
            if (userMsg === null) return; 
            if (userMsg.trim() === "") userMsg = "Left a silent token.";

            // 데이터 증가 및 저장
            currentCount += 1;
            document.getElementById('count').innerText = currentCount;
            localStorage.setItem('tokenCount', currentCount);
            
            savedMessages.unshift(userMsg); // 최신 메시지가 위로 오게 저장
            localStorage.setItem('phoneMsgs', JSON.stringify(savedMessages));

            // 인터랙션 업데이트
            updateLights(currentCount);
            renderMessages();
            
            alert("🪙 Clink! You made it through another day.");
        }
